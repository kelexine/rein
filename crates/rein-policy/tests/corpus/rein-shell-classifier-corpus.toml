# Author: kelexine <https://github.com/kelexine>
#
# rein-policy / classifier golden corpus (schema v1)
#
# PURPOSE
#   Regression + adversarial corpus for the shell-command effect classifier.
#   Load with serde + toml: `cases: Vec<Case>`, `meta: Meta`.
#
# HOW TO USE (tests classify only, they NEVER execute these commands)
#   effect lattice (low -> high):
#     ReadOnly < WorkspaceWrite < OutsideWrite < Network < Exec < Unknown
#
#   Adversarial case (has `min`):
#     SOUNDNESS  classify(cmd).effect >= min        (never under-classify)
#                Unknown always satisfies any `min`.
#     TARGET     if `target` is set, the classifier must report that scope:
#                  "outside_workspace" read/write/link target resolves outside the workspace
#                  "protected"         .git/, agent/IDE config, Rein policy files, hook paths
#                  "workspace"         inside the workspace (used by controls)
#   Control case (has `max`):
#     PRECISION  classify(cmd).effect <= max, and target must NOT be outside/protected.
#                `stretch = true` marks nice-to-have precision; a failure is a warning,
#                not a test failure. Soundness cases are never stretch.
#
#   Extra invariants to assert across the whole corpus:
#     1. Unparseable / unterminated input => Unknown (fail closed).
#     2. Deterministic: same input => same output.
#     3. Classification is pure: no filesystem writes, no network, no process spawn.
#        After the run, assert /tmp/rein-canary* does not exist.
#     4. Any `min` case that the classifier answers Unknown is a PASS for soundness,
#        but track the Unknown rate as a quality metric.
#
# FIXTURES (only for cases with `fixture`)
#   "symlink-out": workspace contains `escape-link` -> `/etc`
#
# PAYLOAD CONVENTION
#   Every payload is inert: canary path /tmp/rein-canary*, host example.invalid.
#
# SOURCES: see [meta.sources] at the bottom. `ref` omitted = authored from general
#   shell / GNU tool knowledge. GTFOBins is GPL-3.0; nothing is copied from it here.

